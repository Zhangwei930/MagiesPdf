name: release

# Installers are built on each platform's own runner, because they cannot all
# be built anywhere else: a Windows NSIS installer needs Wine off Windows, and
# a .deb needs fpm. Building each on its native runner sidesteps both.
#
#  - Push a `v<major>.<minor>.<patch>` tag -> build every platform and publish
#    a GitHub Release. Loose tags like `v1.0` or `v-test` do not match and
#    cannot publish by accident.
#  - `workflow_dispatch` -> build everything without publishing, so the
#    packaging can be exercised without cutting a release. It publishes only
#    when run from a strict version tag *and* `publish` is ticked.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (only from a v*.*.* tag)"
        type: boolean
        default: false

permissions:
  contents: read

# A release build is never worth cancelling half-way; a re-run of the same tag
# waits instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml runs on branches and pull requests, so a tag push would otherwise
  # ship artifacts from code nothing had checked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others would have
      # worked; a partial release is caught by the release job's needs anyway.
      fail-fast: false
      matrix:
        include:
          - name: mac-x64
            os: macos-15-intel
            script: pack:mac-x64
          - name: mac-arm64
            os: macos-15
            script: pack:mac-arm64
          - name: win-x64
            os: windows-latest
            script: pack:win-x64
          - name: win-arm64
            os: windows-11-arm
            script: pack:win-arm64
          - name: linux-x64
            os: ubuntu-latest
            script: pack:linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

      # electron-builder writes to release/<version>/. Copying the installers to
      # a fixed directory first is what makes the artifact's layout flat and
      # predictable: uploading `release/*/...` directly would root the artifact
      # at the part before the first wildcard, and the release job would find
      # everything one directory deeper than it looked.
      #
      # -mindepth/-maxdepth 2 keeps this to release/<version>/<file>, so the
      # unpacked .app and linux-unpacked trees are left behind, and naming the
      # extensions skips builder-debug.yml while keeping the latest*.yml feeds
      # that electron-updater reads.
      - name: Stage the installers
        shell: bash
        run: |
          set -eu
          mkdir -p staging
          find release -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} staging/ \;
          ls -l staging

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: staging

  release:
    needs: build
    # Only a strict version tag publishes. A manual run has to be started from
    # such a tag and tick the box, so a tag-shaped branch cannot leak a release.
    if: |
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The changelog was written by hand for people; notes generated from
      # commit subjects would say something different, and worse.
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/releaseNotes.mjs "${{ github.ref }}" > release_notes.md

      - name: Check every platform produced something
        run: |
          set -eu
          for pattern in '*.dmg' '*.exe' '*.deb' '*.AppImage' 'latest*.yml'; do
            # shellcheck disable=SC2086
            count=$(find artifacts -name "$pattern" | wc -l)
            echo "  $pattern: $count"
            if [ "$count" -eq 0 ]; then
              echo "::error::No $pattern among the artifacts; refusing to publish a partial release."
              exit 1
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          name: MagiesPdf ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.blockmap
            artifacts/latest*.yml
