name: Bug report
description: Something is broken or behaves incorrectly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security issues** → email per [SECURITY.md](https://github.com/Zhangwei930/MagiesPdf/blob/main/SECURITY.md), do not file here.
  - type: input
    id: version
    attributes:
      label: App version
      description: From About / the installer filename (e.g. 3.0.0)
      placeholder: "3.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows x64
        - Windows ARM64
        - Linux x64
        - Other / from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Choose …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. Redact paths and secrets.
